{% extends 'base.html' %}
{% block title %}{{ title }} · TaskFlow{% endblock %}
{% block content %}
<div class="card form-card">
  <h1 style="margin-top:0">{{ title }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include 'includes/field.html' %}{% endfor %}
    <div class="form-actions">
      <button class="btn" type="submit">Save task</button>
      <a class="btn btn-ghost" href="{% url 'task_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
